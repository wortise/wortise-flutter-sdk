group 'com.wortise.ads.flutter'
version '1.8.0'

buildscript {
    ext.kotlin_version = '2.2.21'

    repositories {
        google()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        gradlePluginPortal()

        maven { url 'https://maven.wortise.com/artifactory/public' }
        maven { url 'https://artifact.bytedance.com/repository/pangle' }
        maven { url 'https://artifactory.bidmachine.io/bidmachine' }
        maven { url 'https://cboost.jfrog.io/artifactory/chartboost-ads/' }
    }
}

apply plugin: 'com.android.library'

if (project.extensions.findByName('kotlin') == null) {
    project.pluginManager.apply('kotlin-android')
}

def usingKgp = project.plugins.hasPlugin('org.jetbrains.kotlin.android')

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def javaVersion = agpMajor >= 9 ? JavaVersion.VERSION_11 : JavaVersion.VERSION_1_8

android {
    compileSdk 35

    if (project.android.hasProperty('namespace')) {
        namespace 'com.wortise.ads.flutter'
    }

    defaultConfig {
        minSdk 24
    }

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility javaVersion
        targetCompatibility javaVersion
    }

    if (usingKgp) {
        kotlinOptions {
            jvmTarget = javaVersion.toString()
        }
    }
}

dependencies {
    api 'com.wortise:android-sdk:1.8.0'

    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}

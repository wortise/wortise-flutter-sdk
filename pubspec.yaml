name: wortise
description: Wortise Flutter plugin
version: 1.8.0
homepage: https://wortise.com

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.wortise.ads.flutter
        pluginClass: WortiseFlutterPlugin
      ios:
        pluginClass: WortiseFlutterPlugin
